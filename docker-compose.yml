version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Sec_Root_P@ssw0rd_2026!
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: shop_user
      MYSQL_PASSWORD: Shop_User_P@ssw0rd_2026!
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    networks:
      - backend_net

  web:
    build: . 
    container_name: ecommerce_web
    restart: always
    environment:
      DB_HOST: db
      DB_USER: shop_user
      DB_PASSWORD: Shop_User_P@ssw0rd_2026!
      DB_NAME: ecommerce_db
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:latest
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
