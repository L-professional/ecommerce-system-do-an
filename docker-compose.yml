version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecommerce_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
      - ./db_init:/docker-entrypoint-initdb.d
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_pma
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  web:
    build: . 
    container_name: ecommerce_web
    restart: always
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:latest
    container_name: ecommerce_nginx
    restart: always
    ports:
      - "80:80"    
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: ecommerce_nginx_exporter
    restart: always
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: ecommerce_mysql_exporter
    restart: always
    volumes:
      - ./mysql_config/exporter.cnf:/etc/my.cnf:ro
    command:
      - --config.my-cnf=/etc/my.cnf
      - --mysqld.address=db:3306
      - --web.listen-address=:9104
    ports:
      - "9104:9104"
    depends_on:
      - db
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net
      - frontend_net

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana-dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: ecommerce_cadvisor
    restart: always
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - frontend_net

  loki:
    image: grafana/loki:2.9.0
    container_name: ecommerce_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

  promtail:
    image: grafana/promtail:2.9.0
    container_name: ecommerce_promtail
    restart: always
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend_net

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge

volumes:
  grafana_data:
