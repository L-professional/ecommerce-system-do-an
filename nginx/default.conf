server {
    listen 80;
    server_name localhost;

    # Hardening: Ẩn thông tin phiên bản Nginx
    server_tokens off;

    # Hardening: Bộ tiêu chuẩn HTTP Security Headers đầy đủ
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://images.unsplash.com https://via.placeholder.com; font-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;" always;

    # Endpoint cung cấp metrics cho Nginx Prometheus Exporter
    location /stub_status {
        stub_status;
        allow all;
    }

    location / {
        proxy_pass http://web:8080; # Chuyển hướng traffic vào container web chạy non-root port 8080
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_hide_header X-Powered-By; # Ẩn header lộ công nghệ backend PHP
    }
}
