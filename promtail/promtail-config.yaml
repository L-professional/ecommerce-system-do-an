server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ecommerce_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Lọc: Chỉ thu thập log của các container có tên bắt đầu bằng /ecommerce_
      - source_labels: ['__meta_docker_container_name']
        regex: '/(ecommerce_.*)'
        action: keep

      # Gán nhãn container đầy đủ (ví dụ: ecommerce_nginx, ecommerce_web, ecommerce_db)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Gán nhãn service ngắn gọn (ví dụ: nginx, web, db, pma, grafana...)
      - source_labels: ['__meta_docker_container_name']
        regex: '/ecommerce_(.*)'
        target_label: 'service'

      # Gán nhãn project cố định để luôn có label pair hợp lệ
      - target_label: 'job'
        replacement: 'ecommerce_logs'
